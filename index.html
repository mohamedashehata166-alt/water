<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydroPoints</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}

.points-box{
    position:fixed;
    top:10px;
    right:10px;
    background:#22c55e;
    padding:10px 15px;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
}

.container{
    max-width:400px;
    margin:auto;
    margin-top:60px;
}

h1{
    color:#38bdf8;
}

.water{
    font-size:80px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:15px;
    margin:15px 0;
}

button{
    background:#38bdf8;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

.progress{
    width:100%;
    height:25px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0%;
    background:#22c55e;
    transition:0.4s;
}

#prizeBtn{
    display:none;
    background:gold;
    color:black;
    font-weight:bold;
    margin-top:15px;
}

#message{
    color:#22c55e;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="points-box">
⭐ <span id="topPoints">0</span>
</div>

<div class="container">

<h1>💧 HydroPoints</h1>

<div class="water">🥤</div>

<div class="card">
<h2>اليوم رقم</h2>
<h1 id="dayNumber">1</h1>
</div>

<div class="card">
<h2>أكواب اليوم</h2>
<h1 id="cups">0 / 8</h1>
</div>

<div class="card">
<h2>التقدم للجائزة</h2>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

<p id="goal">0 / 300 نقطة</p>

</div>

<button onclick="drinkWater()">🥤 شربت كوب ماء</button>

<h2 id="message"></h2>

<button id="prizeBtn">
🎁 اكسب الجائزة الآن
</button>

</div>

<script>

let cups = Number(localStorage.getItem("cups")) || 0;
let points = Number(localStorage.getItem("points")) || 0;
let days = Number(localStorage.getItem("days")) || 1;

let today = new Date().toDateString();

if(localStorage.getItem("lastDay") !== today){

cups = 0;

localStorage.setItem("cups",0);

localStorage.setItem("lastDay",today);

}

update();

function drinkWater(){

if(cups >= 8) return;

cups++;
points += 10;

if(cups === 8){

points += 20;

document.getElementById("message").innerHTML =
"🎉 ممتاز! أكملت هدف اليوم";

}

localStorage.setItem("cups",cups);
localStorage.setItem("points",points);

update();
}

function update(){

document.getElementById("cups").innerText =
cups + " / 8";

document.getElementById("topPoints").innerText =
points;

document.getElementById("dayNumber").innerText =
days;

let percent = (points / 300) * 100;

if(percent > 100){
percent = 100;
}

document.getElementById("fill").style.width =
percent + "%";

document.getElementById("goal").innerText =
points + " / 300 نقطة";

if(points >= 300){

document.getElementById("message").innerHTML =
"🏆 مبروك! يمكنك استلام الجائزة";

document.getElementById("prizeBtn").style.display =
"inline-block";

}

}
</script>

</body>
</html>
